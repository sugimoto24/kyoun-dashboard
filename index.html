<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>強運体質プロジェクト — うんこダッシュボード</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Sans','Yu Gothic','Meiryo',sans-serif;background:#f0f2f5;min-height:100vh;padding:20px}
.rpg-wrap{max-width:900px;margin:0 auto}
.rpg-header{text-align:center;margin-bottom:24px;padding:24px;background:#1F3864;border-radius:16px;color:#fff}
.rpg-title{font-size:24px;font-weight:700;margin-bottom:6px}
.rpg-sub{font-size:13px;opacity:.8;font-style:italic}
.sync-bar{background:#fff;border-radius:12px;padding:12px 20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sync-label{font-size:12px;color:#666;font-weight:700}
.sync-status{font-size:12px;color:#888;flex:1}
.sync-btn{font-size:12px;font-weight:700;padding:7px 16px;border-radius:8px;border:none;background:#1F3864;color:#fff;cursor:pointer;white-space:nowrap}
.sync-btn:hover{background:#2c4f8c}
.slider-section{background:#fff;border-radius:12px;padding:16px 20px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.slider-title{font-size:13px;color:#666;margin-bottom:12px}
.slider-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.slider-row{display:flex;flex-direction:column;gap:4px}
.slider-name{font-size:12px;font-weight:700}
.slider-ctrl{display:flex;align-items:center;gap:8px}
.slider-ctrl input[type=range]{flex:1;height:4px;cursor:pointer}
.slider-val{font-size:12px;font-weight:700;min-width:38px;text-align:right;color:#333}
.member-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:20px}
.member-card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:transform .15s,box-shadow .15s}
.member-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.card-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.avatar{width:64px;height:64px;border-radius:50%;overflow:hidden;flex-shrink:0;border:3px solid}
.avatar img{width:100%;height:100%;object-fit:cover}
.member-info{flex:1;min-width:0}
.member-name{font-size:15px;font-weight:700;color:#222}
.member-title{font-size:11px;color:#888;margin-top:2px}
.level-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
.item-box{border-radius:10px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;border:2px solid}
.item-icon{font-size:32px;line-height:1;flex-shrink:0}
.item-name{font-size:14px;font-weight:700}
.item-desc{font-size:11px;margin-top:3px;opacity:.85}
.gauge-label{display:flex;justify-content:space-between;font-size:11px;color:#888;margin-bottom:4px}
.gauge-track{height:9px;background:#eee;border-radius:5px;overflow:hidden}
.gauge-fill{height:100%;border-radius:5px;transition:width .6s ease}
.items-row{margin:8px 0 6px;font-size:11px;color:#888}
.kpi-list{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.kpi-row{display:flex;align-items:center;gap:8px;font-size:12px}
.kpi-name{color:#888;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-track{flex:2;height:5px;background:#eee;border-radius:3px;overflow:hidden}
.kpi-fill{height:100%;border-radius:3px}
.kpi-pct{font-size:11px;font-weight:700;min-width:34px;text-align:right}
.team-footer{background:#fff;border-radius:14px;padding:20px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.team-label{font-size:13px;color:#666;margin-bottom:8px;font-weight:600}
.team-progress{height:14px;background:#eee;border-radius:7px;overflow:hidden;margin-bottom:10px}
.team-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,#7F77DD,#AFA9EC);transition:width .8s ease}
.team-stats{display:flex;justify-content:center;gap:32px}
.team-stat{font-size:13px;color:#888}
.team-stat span{font-weight:700;color:#333;font-size:15px}
@keyframes sparkle{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.2) rotate(8deg)}}
.legendary{animation:sparkle 1.2s ease-in-out infinite}
</style>
</head>
<body>
<div class="rpg-wrap">
  <div class="rpg-header">
    <div class="rpg-title">💩 強運体質プロジェクト — 冒険者ダッシュボード 💩</div>
    <div class="rpg-sub">「行動量が増えた結果、良い出来事の発生確率が上がり、それを掴み続けている状態」</div>
  </div>
  <div class="sync-bar">
    <span class="sync-label">📡 スプレッドシート連携</span>
    <span class="sync-status" id="sync-status">🔄 接続中...</span>
    <button class="sync-btn" onclick="fetchFromSheet()">🔄 今すぐ更新</button>
  </div>
  <div class="slider-section">
    <div class="slider-title">📊 手動調整（スプレッドシート更新後は「今すぐ更新」を押してください）</div>
    <div class="slider-grid" id="sliders"></div>
  </div>
  <div class="member-grid" id="cards"></div>
  <div class="team-footer">
    <div class="team-label">💩 チーム全体の強運レベル</div>
    <div class="team-progress"><div class="team-fill" id="team-fill"></div></div>
    <div class="team-stats">
      <div class="team-stat">平均達成率 <span id="team-avg">—</span></div>
      <div class="team-stat">獲得うんこ <span id="team-items">—</span> / 24</div>
    </div>
  </div>
</div>

};
const LEVELS = [
  {min:0,   lv:1, title:'うんこ見習い',      icon:'💩',      item:'ちびうんこ',
   desc:'まだ出たてのちびうんこ…でも旅は始まった！',
   bg:'#FFF3E0', border:'#FFCC80', bt:'#E65100'},
  {min:20,  lv:2, title:'うんこ戦士',        icon:'💩✨',    item:'ゴールデンうんこ',
   desc:'黄金に輝くうんこ…運気の目覚めを感じる！',
   bg:'#FFFDE7', border:'#FFD600', bt:'#F57F17'},
  {min:40,  lv:3, title:'うんこ騎士',        icon:'💩🔩',    item:'メタルうんこ',
   desc:'硬い！強い！経験値もはぐれがちなやつ！',
   bg:'#ECEFF1', border:'#90A4AE', bt:'#37474F'},
  {min:60,  lv:4, title:'はぐれうんこ使い',  icon:'💩💨',    item:'はぐれうんこ',
   desc:'捕まえた！めったに現れない強運の証！',
   bg:'#F3E5F5', border:'#CE93D8', bt:'#6A1B9A'},
  {min:80,  lv:5, title:'キングうんこ将軍',  icon:'👑💩',    item:'キングうんこ',
   desc:'王者の風格…チームに強運が降り注ぐ！',
   bg:'#FFF8E1', border:'#FFB300', bt:'#E65100'},
  {min:100, lv:6, title:'伝説の強運マスター', icon:'🌟💩🌟',  item:'でんせつのうんこ',
   desc:'ついに降臨…伝説のうんこがチームを救う！',
   bg:'#EDE7F6', border:'#7C4DFF', bt:'#4527A0'},
];
const MEMBERS = [
  {id:'koichi', name:'浩一リーダー', color:'#C0392B', av:'koichi', pos:'center center', kpis:['2次店訪問','営業同行','見積もり案件']},
  {id:'goto',   name:'後藤',         color:'#0F6E56', av:'goto',   pos:'center center', kpis:['確認の場','声掛け','事例共有']},
  {id:'takagi', name:'高木',         color:'#185FA5', av:'takagi', pos:'center center', kpis:['新規接点','案件化','Slack発信']},
  {id:'sato',   name:'佐藤',         color:'#BA7517', av:'sato',   pos:'center center', kpis:['外部接点','改善ネタ','Slack投稿']},
];

var GAS_URL = 'https://script.google.com/macros/s/AKfycbzHw6zOpx_qNG_4w6QZNlgrQjjvs5wHh3vTh-oh65N-w7i3OnAbeF3YVDXRVaZAgVNrNw/exec';
var rates = {koichi:0, goto:0, takagi:0, sato:0};

function fetchFromSheet() {
  document.getElementById('sync-status').textContent = '🔄 スプレッドシートから取得中...';
  fetch(GAS_URL)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      rates.koichi = Number(data.koichi) || 0;
      rates.goto   = Number(data.goto)   || 0;
      rates.takagi = Number(data.takagi) || 0;
      rates.sato   = Number(data.sato)   || 0;
      renderAll();
      syncSliders();
      document.getElementById('sync-status').textContent =
        '✅ 最終取得: ' + (data.updated || '—');
    })
    .catch(function(err) {
      document.getElementById('sync-status').textContent = '⚠️ 取得失敗（GASの設定を確認してください）';
      console.error(err);
    });
}

function syncSliders() {
  var ids = ['koichi','goto','takagi','sato'];
  ids.forEach(function(id) {
    var sl = document.getElementById('sl-' + id);
    var sv = document.getElementById('sv-' + id);
    if (sl) { sl.value = rates[id]; sv.textContent = rates[id] + '%'; }
  });
}

function getLv(p) {
  for (var i = LEVELS.length - 1; i >= 0; i--) {
    if (p >= LEVELS[i].min) return LEVELS[i];
  }
  return LEVELS[0];
}
function getUnlocked(p) {
  return LEVELS.filter(function(l) {
    return p >= l.min && (l.lv < 6 || p >= 100);
  });
}
function renderCard(m, pct) {
  var lv = getLv(pct);
  var unlocked = getUnlocked(pct);
  var k0 = Math.min(100, Math.round(pct * 0.9));
  var k1 = Math.min(100, Math.round(pct * 1.05));
  var k2 = Math.min(100, Math.round(pct * 0.95));
  var kpis = [k0, k1, k2];
  var isMax = pct >= 100;
  var iconClass = isMax ? 'item-icon legendary' : 'item-icon';
  var kpiHtml = '';
  for (var i = 0; i < m.kpis.length; i++) {
    kpiHtml += '<div class="kpi-row">' +
      '<div class="kpi-name">' + m.kpis[i] + '</div>' +
      '<div class="kpi-track"><div class="kpi-fill" style="width:' + kpis[i] + '%;background:' + m.color + '"></div></div>' +
      '<div class="kpi-pct" style="color:' + m.color + '">' + kpis[i] + '%</div>' +
      '</div>';
  }
  var iconsHtml = '';
  for (var j = 0; j < unlocked.length; j++) {
    iconsHtml += '<span style="font-size:15px">' + unlocked[j].icon + '</span>';
  }
  return '<div class="member-card">' +
    '<div class="card-top">' +
      '<div class="avatar" style="border-color:' + m.color + '">' +
        '<img src="' + AV[m.av] + '" alt="' + m.name + '" style="object-position:' + m.pos + '">' +
      '</div>' +
      '<div class="member-info">' +
        '<div class="member-name">' + m.name + '</div>' +
        '<div class="member-title">' + lv.title + '</div>' +
      '</div>' +
      '<div class="level-badge" style="background:' + lv.border + ';color:' + lv.bt + '">Lv.' + lv.lv + '</div>' +
    '</div>' +
    '<div class="item-box" style="background:' + lv.bg + ';border-color:' + lv.border + '">' +
      '<div class="' + iconClass + '">' + lv.icon + '</div>' +
      '<div>' +
        '<div class="item-name" style="color:' + lv.bt + '">' + lv.item + '</div>' +
        '<div class="item-desc" style="color:' + lv.bt + '">' + lv.desc + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="gauge-label"><span>達成率</span><span style="font-weight:700;color:' + m.color + '">' + Math.round(pct) + '%</span></div>' +
    '<div class="gauge-track"><div class="gauge-fill" style="width:' + Math.min(100, pct) + '%;background:' + m.color + '"></div></div>' +
    '<div class="items-row">獲得うんこ ' + unlocked.length + '/6 &nbsp;' + iconsHtml + '</div>' +
    '<div class="kpi-list">' + kpiHtml + '</div>' +
  '</div>';
}
function renderAll() {
  var html = '';
  for (var i = 0; i < MEMBERS.length; i++) {
    html += renderCard(MEMBERS[i], rates[MEMBERS[i].id]);
  }
  document.getElementById('cards').innerHTML = html;
  var vals = Object.values(rates);
  var sum = 0;
  for (var j = 0; j < vals.length; j++) sum += vals[j];
  var avg = Math.round(sum / vals.length);
  var totalItems = 0;
  for (var k = 0; k < MEMBERS.length; k++) {
    totalItems += getUnlocked(rates[MEMBERS[k].id]).length;
  }
  document.getElementById('team-fill').style.width = Math.min(100, avg) + '%';
  document.getElementById('team-avg').textContent = avg + '%';
  document.getElementById('team-items').textContent = totalItems;
}
function buildSliders() {
  var colors = {koichi:'#C0392B', goto:'#0F6E56', takagi:'#185FA5', sato:'#BA7517'};
  var names  = {koichi:'浩一リーダー', goto:'後藤', takagi:'高木', sato:'佐藤'};
  var html = '';
  var ids = ['koichi','goto','takagi','sato'];
  for (var i = 0; i < ids.length; i++) {
    var id = ids[i];
    html += '<div class="slider-row">' +
      '<div class="slider-name" style="color:' + colors[id] + '">' + names[id] + '</div>' +
      '<div class="slider-ctrl">' +
        '<input type="range" min="0" max="100" step="1" value="' + rates[id] + '" id="sl-' + id + '">' +
        '<div class="slider-val" id="sv-' + id + '">' + rates[id] + '%</div>' +
      '</div>' +
    '</div>';
  }
  document.getElementById('sliders').innerHTML = html;
  ids.forEach(function(id) {
    document.getElementById('sl-' + id).addEventListener('input', function() {
      rates[id] = +this.value;
      document.getElementById('sv-' + id).textContent = this.value + '%';
      renderAll();
    });
  });
}
buildSliders();
renderAll();
fetchFromSheet();
setInterval(fetchFromSheet, 5 * 60 * 1000);

</script>
