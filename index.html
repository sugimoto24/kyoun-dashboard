<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>強運体質プロジェクト — 冒険者ダッシュボード</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Sans','Yu Gothic','Meiryo',sans-serif;background:#f0f2f5;min-height:100vh;padding:20px}
.rpg-wrap{max-width:900px;margin:0 auto}
.rpg-header{text-align:center;margin-bottom:24px;padding:24px;background:#1F3864;border-radius:16px;color:#fff}
.rpg-title{font-size:24px;font-weight:700;margin-bottom:6px}
.rpg-sub{font-size:13px;opacity:.8;font-style:italic}
.slider-section{background:#fff;border-radius:12px;padding:16px 20px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.slider-title{font-size:13px;color:#666;margin-bottom:12px}
.slider-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.slider-row{display:flex;flex-direction:column;gap:4px}
.slider-name{font-size:12px;font-weight:700}
.slider-ctrl{display:flex;align-items:center;gap:8px}
.slider-ctrl input[type=range]{flex:1;height:4px;accent-color:#7F77DD;cursor:pointer}
.slider-val{font-size:12px;font-weight:700;min-width:38px;text-align:right;color:#333}
.member-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:20px}
.member-card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:transform .15s,box-shadow .15s}
.member-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.card-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.avatar{width:60px;height:60px;border-radius:50%;overflow:hidden;flex-shrink:0;border:3px solid}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:top center}
.member-info{flex:1;min-width:0}
.member-name{font-size:15px;font-weight:700;color:#222}
.member-title{font-size:11px;color:#888;margin-top:2px}
.level-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
.item-box{border-radius:10px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;border:2px solid}
.item-icon{font-size:32px;line-height:1;flex-shrink:0}
.item-name{font-size:14px;font-weight:700}
.item-desc{font-size:11px;margin-top:3px;opacity:.85}
.gauge-label{display:flex;justify-content:space-between;font-size:11px;color:#888;margin-bottom:4px}
.gauge-track{height:9px;background:#eee;border-radius:5px;overflow:hidden}
.gauge-fill{height:100%;border-radius:5px;transition:width .6s ease}
.items-row{margin:8px 0 6px;font-size:11px;color:#888}
.kpi-list{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.kpi-row{display:flex;align-items:center;gap:8px;font-size:12px}
.kpi-name{color:#888;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-track{flex:2;height:5px;background:#eee;border-radius:3px;overflow:hidden}
.kpi-fill{height:100%;border-radius:3px}
.kpi-pct{font-size:11px;font-weight:700;min-width:34px;text-align:right}
.team-footer{background:#fff;border-radius:14px;padding:20px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.team-label{font-size:13px;color:#666;margin-bottom:8px;font-weight:600}
.team-progress{height:14px;background:#eee;border-radius:7px;overflow:hidden;margin-bottom:10px}
.team-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,#7F77DD,#AFA9EC);transition:width .8s ease}
.team-stats{display:flex;justify-content:center;gap:32px}
.team-stat{font-size:13px;color:#888}
.team-stat span{font-weight:700;color:#333;font-size:15px}
@keyframes sparkle{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.15) rotate(5deg)}}
.item-icon.legendary{animation:sparkle 1.2s ease-in-out infinite}
</style>
</head>
<body>
<div class="rpg-wrap">
  <div class="rpg-header">
    <div class="rpg-title">💩 強運体質プロジェクト — 冒険者ダッシュボード 💩</div>
    <div class="rpg-sub">「行動量が増えた結果、良い出来事の発生確率が上がり、それを掴み続けている状態」</div>
  </div>
  <div class="slider-section">
    <div class="slider-title">📊 達成率を入力・調整してください</div>
    <div class="slider-grid" id="sliders"></div>
  </div>
  <div class="member-grid" id="cards"></div>
  <div class="team-footer">
    <div class="team-label">⚔️ チーム全体の強運レベル</div>
    <div class="team-progress"><div class="team-fill" id="team-fill"></div></div>
    <div class="team-stats">
      <div class="team-stat">平均達成率 <span id="team-avg">—</span></div>
      <div class="team-stat">獲得うんこ <span id="team-items">—</span> / 24</div>
    </div>
  </div>
</div>

  {id:'koichi', name:'浩一リーダー', color:'#C0392B', av:'koichi', kpis:['2次店訪問','営業同行','見積もり案件']},
  {id:'goto',   name:'後藤',         color:'#0F6E56', av:'goto',   kpis:['確認の場','声掛け','事例共有']},
  {id:'takagi', name:'高木',         color:'#185FA5', av:'takagi', kpis:['新規接点','案件化','Slack発信']},
  {id:'sato',   name:'佐藤',         color:'#BA7517', av:'sato',   kpis:['外部接点','改善ネタ','Slack投稿']},
];

const LEVELS = [
  {
    min:0, lv:1, title:'うんこ見習い',
    icon:'💩', item:'ちびうんこ',
    desc:'まだ出たてのちびうんこ…でも旅は始まった！',

  },
  {
    min:40, lv:3, title:'うんこ騎士',
    icon:'💩🔩', item:'メタルうんこ',

    min:80, lv:5, title:'キングうんこ将軍',

    bg:'#EDE7F6', border:'#7C4DFF', bt:'#4527A0'
  },
];

const rates = {koichi:62, goto:80, takagi:45, sato:30};

function getLv(p){ for(let i=LEVELS.length-1;i>=0;i--){ if(p>=LEVELS[i].min) return LEVELS[i]; } return LEVELS[0]; }
function getItems(p){ return LEVELS.filter(l=>p>=l.min&&(l.lv<6||p>=100)).length; }

function renderCard(m, pct){
  const lv = getLv(pct);
  const unlocked = LEVELS.filter(l=>pct>=l.min&&(l.lv<6||p=>100));
  const unlockedList = LEVELS.filter(l=>pct>=l.min&&(l.lv<6||pct>=100));
  const kpis = m.kpis.map((_,i)=>Math.min(100,Math.round([pct*.9,pct*1.05,pct*.95][i])));
  const isMax = pct>=100;
  return `<div class="member-card">
    <div class="card-top">
      <div class="avatar" style="border-color:${m.color}">
        <img src="${AV[m.av]}" alt="${m.name}">
      </div>
      <div class="member-info">
        <div class="member-name">${m.name}</div>
        <div class="member-title">${lv.title}</div>
      </div>
      <div class="level-badge" style="background:${lv.border};color:${lv.bt}">Lv.${lv.lv}</div>
    </div>
    <div class="item-box" style="background:${lv.bg};border-color:${lv.border}">
      <div class="item-icon${isMax?' legendary':''}">${lv.icon}</div>
      <div>
        <div class="item-name" style="color:${lv.bt}">${lv.item}</div>
        <div class="item-desc" style="color:${lv.bt}">${lv.desc}</div>
      </div>
    </div>
    <div class="gauge-label"><span>達成率</span><span style="font-weight:700;color:${m.color}">${Math.round(pct)}%</span></div>
    <div class="gauge-track"><div class="gauge-fill" style="width:${Math.min(100,pct)}%;background:${m.color}"></div></div>
    <div class="items-row">獲得うんこ ${unlockedList.length}/6 &nbsp;${unlockedList.map(l=>`<span style="font-size:15px">${l.icon}</span>`).join('')}</div>
    <div class="kpi-list">${m.kpis.map((k,i)=>`
      <div class="kpi-row">
        <div class="kpi-name">${k}</div>
        <div class="kpi-track"><div class="kpi-fill" style="width:${kpis[i]}%;background:${m.color}"></div></div>
        <div class="kpi-pct" style="color:${m.color}">${kpis[i]}%</div>
      </div>`).join('')}
    </div>
  </div>`;
}

function renderAll(){
  document.getElementById('cards').innerHTML = MEMBERS.map(m=>renderCard(m,rates[m.id])).join('');
  const vals = Object.values(rates);
  const avg = Math.round(vals.reduce((s,v)=>s+v,0)/vals.length);
  const items = MEMBERS.reduce((s,m)=>s+getItems(rates[m.id]),0);
  document.getElementById('team-fill').style.width = Math.min(100,avg)+'%';
  document.getElementById('team-avg').textContent = avg+'%';
  document.getElementById('team-items').textContent = items;
}

function buildSliders(){
  const colors = {koichi:'#C0392B',goto:'#0F6E56',takagi:'#185FA5',sato:'#BA7517'};
  const names  = {koichi:'浩一リーダー',goto:'後藤',takagi:'高木',sato:'佐藤'};
  document.getElementById('sliders').innerHTML = Object.keys(rates).map(id=>`
    <div class="slider-row">
      <div class="slider-name" style="color:${colors[id]}">${names[id]}</div>
      <div class="slider-ctrl">
        <input type="range" min="0" max="100" step="1" value="${rates[id]}"
          oninput="rates['${id}']=+this.value;document.getElementById('sv-${id}').textContent=this.value+'%';renderAll()">
        <div class="slider-val" id="sv-${id}">${rates[id]}%</div>
      </div>
    </div>`).join('');
}

buildSliders();
renderAll();
</script>
